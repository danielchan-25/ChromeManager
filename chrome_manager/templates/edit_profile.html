<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{% set display_name = (profile.project_name or '未命名项目') ~ ' + ' ~ (profile.platform or '未指定平台') %}
<title>编辑 {{ display_name }} · ChromeManager</title>
<link rel="stylesheet" href="/static/app.css?v=20261029-no-metrics">
<script src="/static/app.js?v=20261029-no-metrics" defer></script>
</head>
<body class="console-page">
<main class="subpage" aria-label="编辑实例">
  <header class="page-header"><h1>ChromeManager · 编辑实例</h1><a class="back-link" href="/?selected={{ profile.name | urlencode }}">返回管理页面</a></header>
  <section class="page-content">
    <h2>{{ display_name }}</h2>
    <p class="page-help">仅停止状态可编辑。CDP 端口与用户数据目录保持不变，网址和代理在下次启动时生效。</p>
    <form action="/profiles/{{ profile.name }}/edit" method="post" class="form">
      <label>项目<input name="project_name" value="{{ profile.project_name or '' }}"></label>
      <label>平台<input name="platform" value="{{ profile.platform or '' }}"></label>
      <label>账号（可选）<input name="account_name" value="{{ profile.account_name or '' }}"></label>
      <label>默认打开网址（可多个）<input name="default_url" type="text" value="{{ profile.default_url or '' }}" placeholder="https://example.com, https://example.org"></label>
      <label class="wide proxy-toggle">使用代理<input id="proxy-enabled" name="proxy_enabled" type="checkbox" value="true" data-proxy-toggle="proxy-url" {% if profile.proxy_url %}checked{% endif %}></label>
      <label class="wide" data-proxy-field hidden>代理地址<input id="proxy-url" name="proxy_url" value="{{ profile.proxy_url or '' }}" placeholder="http://127.0.0.1:7890"></label>
      <label class="wide">描述<textarea name="description">{{ profile.description or '' }}</textarea></label>
      <div class="dialog-actions wide"><button type="submit" class="primary-button">保存修改</button><a href="/?selected={{ profile.name | urlencode }}">取消</a></div>
    </form>
  </section>
  <footer class="page-footer"><span>编辑已停止实例</span><time id="desktop-clock"></time></footer>
</main>
</body>
</html>
