<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{% set display_name = (profile.project_name or '未命名项目') ~ ' + ' ~ (profile.platform or '未指定平台') %}
<title>编辑 {{ display_name }} · ChromeManager</title>
<link rel="stylesheet" href="/static/app.css?v=20260922-starting-state-b">
<script src="/static/app.js?v=20260922-starting-state-b" defer></script>
</head>
<body class="win98-page">
<main class="win98-console win98-subwindow win98-edit-window" aria-label="编辑实例">
  <header class="win98-titlebar"><div class="win98-app-title"><span class="pixel-app-icon" aria-hidden="true"></span>ChromeManager · 编辑实例</div><div class="win98-title-actions"><button class="window-control" type="button" title="最小化">_</button><button class="window-control" type="button" title="最大化">□</button><button class="window-control close" type="button" title="关闭">×</button></div></header>
  <section class="win98-page-content">
    <div class="win98-pane-caption">{{ display_name }}</div>
    <p class="win98-help">仅停止状态可编辑。CDP 端口与用户数据目录保持不变，网址和代理在下次启动时生效。</p>
    <form action="/profiles/{{ profile.name }}/edit" method="post" class="form win98-form">
      <label>项目<input name="project_name" value="{{ profile.project_name or '' }}"></label>
      <label>平台<input name="platform" value="{{ profile.platform or '' }}"></label>
      <label>账号（可选）<input name="account_name" value="{{ profile.account_name or '' }}"></label>
      <label>默认打开网址（可多个）<input name="default_url" type="text" value="{{ profile.default_url or '' }}" placeholder="https://example.com, https://example.org"></label>
      <label class="wide win98-proxy-toggle">使用代理<input id="proxy-enabled" name="proxy_enabled" type="checkbox" value="true" data-proxy-toggle="proxy-url" {% if profile.proxy_url %}checked{% endif %}></label>
      <label class="wide" data-proxy-field hidden>代理地址<input id="proxy-url" name="proxy_url" value="{{ profile.proxy_url or '' }}" placeholder="http://127.0.0.1:7890"></label>
      <label class="wide">描述<textarea name="description">{{ profile.description or '' }}</textarea></label>
      <div class="win98-modal-actions wide"><button type="submit" class="win98-button">保存修改</button><a href="/?selected={{ profile.name | urlencode }}" class="win98-button">取消</a></div>
    </form>
  </section>
  <footer class="win98-statusbar"><span><i class="pixel-app-icon"></i> 编辑已停止实例</span><time id="desktop-clock"></time></footer>
</main>
</body>
</html>
