name: Ubuntu tests
on: [push, pull_request, workflow_dispatch]
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth openbox wmctrl x11vnc novnc xclip dbus-x11
      - run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          python -m pip install -e '.[dev]'
      - name: Record Ubuntu runtime versions
        run: |
          python --version
          google-chrome --version
          systemd --version | head -n 1
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: python -m pytest -q -o addopts=''
      - name: Isolated real Chrome integration
        env:
          CHROME_MANAGER_LIVE_TEST: '1'
          CM_TEST_NO_SANDBOX: '1'
        run: xvfb-run -a python -m pytest tests/test_live_chrome.py tests/test_ui_live.py tests/test_desktop_live.py -q -o addopts=''
      - name: Prepare disposable user systemd
        if: success() || failure()
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Verify real systemd service isolation
        if: success() || failure()
        env:
          CHROME_MANAGER_SYSTEMD_TEST: '1'
        run: python -m pytest tests/test_systemd_live.py -q -o addopts=''
      - name: CI service diagnostics
        if: failure()
        run: journalctl --user -u 'chromemanager-ci-*' --no-pager -n 150 || true
